[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigmatch"
version = "1.0.0"
description = "Match SigmaHQ rules against Microsoft Sysmon events in real time"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gui = ["PyQt6>=6.7"]
# `sigmatch live` auto-installs this; the extra is for offline/pre-seeded installs.
etw = ["pyetwkit>=3.2"]

[project.scripts]
sigmatch = "sigmatch.cli:main"

[project.gui-scripts]
sigmatch-gui = "sigmatch.gui:main"

[tool.setuptools.packages.find]
include = ["sigmatch*"]

[tool.setuptools.package-data]
sigmatch = ["assets/*.ico", "assets/*.png"]
